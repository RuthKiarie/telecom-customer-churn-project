name: Keep Streamlit Alive

on:
  schedule:
    # Runs every 6 hours to prevent the 12-hour sleep timer
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allows you to manually trigger it from GitHub anytime

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Streamlit App
        run: |
          curl -I https://telecom-customer-churn-project-crcysyunzqsj5wdqhcmqtk.streamlit.app/